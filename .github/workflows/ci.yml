name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "checks.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: scripts
        run: python3 -m unittest test_probe.py -v
